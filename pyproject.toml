[project]
name = "nsl-kdd"
version = "0.1.0"
description = "NSL-KDD"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["mlruns", "data", ".venv", "venv"]

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes（等价 flake8），I = import 排序（等价 isort）
# 不用 B/UP/SIM：更严但会让队友多改代码，课程项目不必
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]
