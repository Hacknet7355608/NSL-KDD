name: NSL-KDD CI

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  lint-and-test:
    name: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements-dev.txt
        run: python -m pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: python -m ruff check .

      - name: Format check (ruff format --check)
        run: python -m ruff format --check .

      - name: Run tests
        run: python -m pytest -q --cov=app --cov-report=term-missing


  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --build-arg APP_ENV=ci -t nsl-kdd:ci .

      - name: Smoke test /health
        run: |
          docker run -d --name smoke -p 8000:8000 nsl-kdd:ci
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health -o /tmp/health.json; then
              ok=1
              break
            fi
            sleep 2
          done
          docker logs smoke || true
          docker rm -f smoke > /dev/null 2>&1 || true
          if [ "$ok" -ne 1 ]; then
            echo "::error::容器 40 秒内未通过 /health，冒烟失败"
            exit 1
          fi
          cat /tmp/health.json
          echo "::notice::容器健康检查通过"


  build-staging:
    name: build-staging
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - name: Write staging .env from GitHub secrets
        env:
          APP_API_KEY: ${{ secrets.STAGING_API_KEY }}
          LOG_LEVEL: ${{ secrets.STAGING_LOG_LEVEL }}
        run: |
          {
            echo "APP_ENV=staging"
            echo "APP_API_KEY=${APP_API_KEY}"
            echo "LOG_LEVEL=${LOG_LEVEL}"
          } > .env
          sed 's/=.*/=***/' .env     # 打印时遮蔽取值，避免密钥进日志

      - name: Build staging image
        run: docker build --build-arg APP_ENV=staging -t nsl-kdd:staging .

      - name: Run container with staging config
        run: |
          docker run -d --name staging-smoke --env-file .env -p 8001:8000 nsl-kdd:staging
          ok=0
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8001/health; then ok=1; break; fi
            sleep 2
          done
          docker rm -f staging-smoke > /dev/null 2>&1 || true
          if [ "$ok" -ne 1 ]; then
            echo "::error::staging 配置下容器未通过 /health"
            exit 1
          fi


  build-prod:
    name: build-prod
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: prod
    steps:
      - uses: actions/checkout@v7

      - name: Write production .env from GitHub secrets
        env:
          APP_API_KEY: ${{ secrets.PROD_API_KEY }}
          LOG_LEVEL: ${{ secrets.PROD_LOG_LEVEL }}
        run: |
          {
            echo "APP_ENV=production"
            echo "APP_API_KEY=${APP_API_KEY}"
            echo "LOG_LEVEL=${LOG_LEVEL}"
          } > .env
          sed 's/=.*/=***/' .env

      - name: Build production image
        run: docker build --build-arg APP_ENV=production -t nsl-kdd:prod .

      - name: Run container with production config
        run: |
          docker run -d --name prod-smoke --env-file .env -p 8002:8000 nsl-kdd:prod
          ok=0
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8002/health; then ok=1; break; fi
            sleep 2
          done
          docker rm -f prod-smoke > /dev/null 2>&1 || true
          if [ "$ok" -ne 1 ]; then
            echo "::error::production 配置下容器未通过 /health"
            exit 1
          fi
